name: Autonomous Daily Lead Hunter

on:
  schedule:
    # Runs everyday at 03:00 UTC (9:00 AM Bangladesh Time)
    - cron: '0 3 * * *'
  # Allows manual 1-click trigger from GitHub anytime
  workflow_dispatch:

jobs:
  hunt-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install dotenv

      - name: Execute Daily Lead Hunter Engine
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: node scripts/fetch-daily-leads.js

      - name: Commit & Push Fresh Leads
        run: |
          git config --global user.name "GitHub Action Lead Bot"
          git config --global user.email "action@github.com"
          git add data/leads.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-hunt 10 fresh verified leads [skip ci]" && git push)
